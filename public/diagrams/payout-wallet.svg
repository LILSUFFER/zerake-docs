<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="380" height="400" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Выплата только на привязанный кошелёк</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="380" height="400" fill="#ffffff"/><rect x="0.8" y="8" width="378.4" height="382" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><rect x="0.8" y="8" width="378.4" height="40" fill="#f1f4f9" stroke="#94a3b8" stroke-width="1.4"/><text x="95.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Игрок</text><line x1="190" y1="8" x2="190" y2="390" stroke="#94a3b8" stroke-width="1.4"/><text x="285.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Zerake</text><path d="M173.0,90.0 L285.0,90.0 L285.0,142.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M196.0,174.0 L176.0,174.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="165.5" y="149.0" width="41" height="22" rx="4" fill="#ffffff"/><text x="186.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Нет</text><path d="M285.0,206.0 L285.0,235.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="293.0" y="209.5" width="32" height="22" rx="4" fill="#ffffff"/><text x="309.0" y="220.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Да</text><path d="M204.0,258.0 L95.0,258.0 L95.0,323.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="17.0" y="71.0" width="156" height="38" rx="19.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="81.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Запрос</text><text x="95.0" y="98.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">на снятие</text><polygon points="285.0,142.0 374.0,174.0 285.0,206.0 196.0,174.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="166.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Кошелёк в этой сети</text><text x="285.0" y="181.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">привязан?</text><rect x="14.0" y="151.0" width="162" height="46" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="165.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Снять нельзя:</text><text x="95.0" y="182.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">привяжите кошелёк</text><rect x="204.0" y="235.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="249.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Выплата только</text><text x="285.0" y="266.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">на привязанный адрес</text><rect x="17.0" y="323.0" width="156" height="38" rx="19.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="333.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Деньги на вашем</text><text x="95.0" y="350.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">кошельке</text></svg>