chor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M366.0,296.0 L394.0,296.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M475.0,317.0 L475.0,347.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M475.0,389.0 L475.0,419.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M394.0,440.0 L285.0,440.0 L285.0,484.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M374.0,512.0 L394.0,512.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="384.0" y="503.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M285.0,540.0 L285.0,563.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="292.0" y="551.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M366.0,584.0 L584.0,584.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M665.0,605.0 L665.0,656.0 L366.0,656.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M204.0,656.0 L173.0,656.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="17.0" y="63.0" width="156" height="34" rx="17.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Начало</text><rect x="14.0" y="131.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="143.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Снять N фишек</text><text x="95.0" y="160.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">в выбранной сети</text><polygon points="285.0,196.0 374.0,224.0 285.0,252.0 196.0,224.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="216.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Проверки пройдены,</text><text x="285.0" y="231.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">средств хватает?</text><rect x="14.0" y="203.0" width="162" height="42" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="215.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Отказ: другая сеть</text><text x="95.0" y="232.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">или меньше сумма</text><rect x="204.0" y="275.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="287.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Заявка WD-…</text><text x="285.0" y="304.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">«В обработке»</text><rect x="394.0" y="275.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="475.0" y="287.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Взять заявку</text><text x="475.0" y="304.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">(«Беру»)</text><rect x="394.0" y="347.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="475.0" y="359.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Снять N фишек</text><text x="475.0" y="376.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">в ClubGG</text><rect x="394.0" y="419.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="475.0" y="440.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">«Фишки сняты: N»</text><polygon points="285.0,484.0 374.0,512.0 285.0,540.0 196.0,512.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="504.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Сумма совпала,</text><text x="285.0" y="519.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">средств хватает?</text><rect x="394.0" y="491.0" width="162" height="42" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="475.0" y="503.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Исправить сумму /</text><text x="475.0" y="520.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">сообщить владельцу</text><rect x="204.0" y="563.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="575.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Заблокировать заявку,</text><text x="285.0" y="592.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">отправить перевод</text><rect x="584.0" y="563.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="665.0" y="575.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Перевод</text><text x="665.0" y="592.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">подтверждён</text><rect x="204.0" y="635.0" width="162" height="42" rx="4" fill="#12a477" stroke="#0f8a63" stroke-width="1.6"/><text x="285.0" y="647.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">«Выплачено»</text><text x="285.0" y="664.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">+ ссылка</text><rect x="17.0" y="639.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="656.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Кошелёк игрока</text></svg>