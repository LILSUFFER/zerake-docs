#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="299.0" y="380.5" width="32" height="22" rx="4" fill="#ffffff"/><text x="315.0" y="391.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#334155">Да</text><path d="M401.0,436.0 L439.0,436.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M525.0,464.0 L525.0,512.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M525.0,568.0 L525.0,616.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M439.0,644.0 L315.0,644.0 L315.0,702.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M397.0,748.0 L439.0,748.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="394.1" y="737.0" width="41" height="22" rx="4" fill="#ffffff"/><text x="414.6" y="748.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#334155">Нет</text><path d="M315.0,794.0 L315.0,824.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="299.0" y="796.5" width="32" height="22" rx="4" fill="#ffffff"/><text x="315.0" y="807.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#334155">Да</text><path d="M401.0,852.0 L649.0,852.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M735.0,880.0 L735.0,956.0 L401.0,956.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M229.0,956.0 L175.0,956.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="35.0" y="103.0" width="140" height="42" rx="21.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="105.0" y="124.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0b3d2c">Начало</text><rect x="19.0" y="200.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="105.0" y="219.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">Снять N фишек,</text><text x="105.0" y="236.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">ввести PIN</text><polygon points="315.0,286.0 397.0,332.0 315.0,378.0 233.0,332.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="315.0" y="323.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Проверки пройдены,</text><text x="315.0" y="340.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">средств хватает?</text><rect x="19.0" y="304.0" width="172" height="56" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="105.0" y="323.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#7a1f2b">Отказ: другая сеть</text><text x="105.0" y="340.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#7a1f2b">или меньше сумма</text><rect x="229.0" y="408.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="315.0" y="427.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">Заявка WD-…</text><text x="315.0" y="444.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">«В обработке»</text><rect x="439.0" y="408.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="525.0" y="427.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">Взять заявку</text><text x="525.0" y="444.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">(«Беру»)</text><rect x="439.0" y="512.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="525.0" y="531.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">Снять N фишек</text><text x="525.0" y="548.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">в ClubGG</text><rect x="439.0" y="616.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="525.0" y="644.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">«Фишки сняты: N»</text><polygon points="315.0,702.0 397.0,748.0 315.0,794.0 233.0,748.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="315.0" y="739.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Сумма совпала,</text><text x="315.0" y="756.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">средств хватает?</text><rect x="439.0" y="720.0" width="172" height="56" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="525.0" y="739.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#7a1f2b">Исправить сумму /</text><text x="525.0" y="756.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#7a1f2b">сообщить владельцу</text><rect x="229.0" y="824.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="315.0" y="843.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">Заблокировать заявку,</text><text x="315.0" y="860.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">отправить перевод</text><rect x="649.0" y="824.0" width="172" height="56" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="735.0" y="843.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">Перевод</text><text x="735.0" y="860.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3b2a7a">подтверждён</text><rect x="229.0" y="928.0" width="172" height="56" rx="4" fill="#12a477" stroke="#0f8a63" stroke-width="1.6"/><text x="315.0" y="947.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ffffff">«Выплачено»</text><text x="315.0" y="964.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ffffff">+ ссылка</text><rect x="35.0" y="935.0" width="140" height="42" rx="21.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="105.0" y="947.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2f4a12">Деньги</text><text x="105.0" y="964.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2f4a12">на кошельке</text></svg>