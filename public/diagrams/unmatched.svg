<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 568" width="570" height="568" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Разбор неопознанного платежа</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="570" height="568" fill="#ffffff"/><rect x="0.8" y="8" width="568.4" height="550" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><rect x="0.8" y="8" width="568.4" height="40" fill="#f1f4f9" stroke="#94a3b8" stroke-width="1.4"/><text x="95.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Zerake</text><line x1="190" y1="8" x2="190" y2="558" stroke="#94a3b8" stroke-width="1.4"/><text x="285.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Команда</text><line x1="380" y1="8" x2="380" y2="558" stroke="#94a3b8" stroke-width="1.4"/><text x="475.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Игрок</text><path d="M172.0,90.0 L285.0,90.0 L285.0,151.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M366.0,174.0 L475.0,174.0 L475.0,235.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M394.0,258.0 L285.0,258.0 L285.0,310.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M373.0,342.0 L394.0,342.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="363.0" y="317.0" width="41" height="22" rx="4" fill="#ffffff"/><text x="383.5" y="328.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Нет</text><path d="M285.0,374.0 L285.0,403.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="293.0" y="377.5" width="32" height="22" rx="4" fill="#ffffff"/><text x="309.0" y="388.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Да</text><path d="M285.0,449.0 L285.0,491.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="18.0" y="71.0" width="154" height="38" rx="19.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="81.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Платёж не совпал</text><text x="95.0" y="98.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">ни с одной заявкой</text><rect x="204.0" y="151.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="165.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Раздел «Неопознанные»</text><text x="285.0" y="182.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">в админке</text><rect x="394.0" y="235.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="475.0" y="249.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Пишет в поддержку:</text><text x="475.0" y="266.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">хэш, номер заявки</text><polygon points="285.0,310.0 373.0,342.0 285.0,374.0 197.0,342.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="334.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Хэш и адрес</text><text x="285.0" y="349.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">совпадают?</text><rect x="394.0" y="319.0" width="162" height="46" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="475.0" y="333.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Поддержка уточняет</text><text x="475.0" y="350.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">у игрока</text><rect x="204.0" y="403.0" width="162" height="46" rx="4" fill="#12a477" stroke="#0f8a63" stroke-width="1.6"/><text x="285.0" y="417.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">Пополнение оформлено,</text><text x="285.0" y="434.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">фишки выданы</text><rect x="208.0" y="491.0" width="154" height="38" rx="19.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="285.0" y="510.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">«Разобрано»</text></svg>