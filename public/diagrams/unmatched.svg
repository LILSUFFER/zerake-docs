еле</text><text x="384" y="164.5">«Неопознанные»</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="325" y="23" width="118" height="56" rx="28" ry="28" fill="#c7f2e4" stroke="#12a477" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(199, 242, 228), rgb(9, 46, 34)); stroke: light-dark(rgb(18, 164, 119), rgb(29, 155, 116));"></rect></g><g style=""><g fill="#0B3D2C" font-family="'Segoe UI'" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(11, 61, 44), rgb(162, 205, 191));"><text x="384" y="49">Фишки не</text><text x="384" y="63">пришли</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="485" y="14" width="118" height="74" rx="8.88" ry="8.88" fill="#ede7ff" stroke="#8b5cf6" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(237, 231, 255), rgb(38, 33, 53)); stroke: light-dark(rgb(139, 92, 246), rgb(162, 122, 254));"></rect></g><g style=""><g fill="#3B2A7A" font-family="'Segoe UI'" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(59, 42, 122), rgb(200, 185, 254));"><text x="544" y="35">Игрок пишет в</text><text x="544" y="49">поддержку и</text><text x="544" y="63">присылает хэш</text><text x="544" y="77">перевода</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="645" y="212" width="118" height="56" rx="6.72" ry="6.72" fill="#ede7ff" stroke="#8b5cf6" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(237, 231, 255), rgb(38, 33, 53)); stroke: light-dark(rgb(139, 92, 246), rgb(162, 122, 254));"></rect></g><g style=""><g fill="#3B2A7A" font-family="'Segoe UI'" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(59, 42, 122), rgb(200, 185, 254));"><text x="704" y="238">Менеджер сверяет</text><text x="704" y="252">хэш с переводом</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><path d="M 864 205 L 926 240 L 864 275 L 802 240 Z"