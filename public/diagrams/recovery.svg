ight="600" fill="#334155">Да</text><path d="M285.0,396.0 L285.0,423.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="292.0" y="409.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><rect x="17.0" y="63.0" width="156" height="34" rx="17.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Начало</text><rect x="14.0" y="131.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="143.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Новый адрес +</text><text x="95.0" y="160.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">секретная фраза</text><polygon points="285.0,196.0 374.0,224.0 285.0,252.0 196.0,224.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Фраза верна?</text><rect x="14.0" y="203.0" width="162" height="42" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="215.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Попытка не принята</text><text x="95.0" y="232.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">(лимит в сутки)</text><rect x="204.0" y="275.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="287.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Смена ждёт 48 ч,</text><text x="285.0" y="304.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">снятие заморожено</text><polygon points="285.0,3