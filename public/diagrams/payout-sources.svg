<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 564" width="570" height="564" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>С каких адресов идёт выплата</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="570" height="564" fill="#ffffff"/><rect x="0.8" y="6" width="568.4" height="548" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><rect x="0.8" y="6" width="568.4" height="38" fill="#f1f4f9" stroke="#94a3b8" stroke-width="1.4"/><text x="95.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Zerake</text><line x1="190" y1="6" x2="190" y2="554" stroke="#94a3b8" stroke-width="1.4"/><text x="285.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Адреса клуба</text><line x1="380" y1="6" x2="380" y2="554" stroke="#94a3b8" stroke-width="1.4"/><text x="475.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Игрок</text><path d="M95.0,97.0 L95.0,124.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M184.0,152.0 L204.0,152.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="194.0" y="143.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M95.0,180.0 L95.0,203.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="102.0" y="191.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M366.0,152.0 L475.0,152.0 L475.0,423.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M95.0,245.0 L95.0,268.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M184.0,296.0 L204.0,296.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="194.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M95.0,324.0 L95.0,419.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="102.0" y="371.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M285.0,317.0 L285.0,347.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M366.0,368.0 L475.0,368.0 L475.0,423.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M95.0,461.0 L95.0,495.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="17.0" y="63.0" width="156" height="34" rx="17.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="71.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Нужно</text><text x="95.0" y="88.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">выплатить X</text><polygon points="95.0,124.0 184.0,152.0 95.0,180.0 6.0,152.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="144.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Есть адрес,</text><text x="95.0" y="159.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">где лежит ≥ X?</text><rect x="204.0" y="131.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="143.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Взять самый маленький</text><text x="285.0" y="160.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">из подходящих</text><rect x="14.0" y="203.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="215.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Набрать X с нескольких</text><text x="95.0" y="232.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">адресов, с крупных</text><polygon points="95.0,268.0 184.0,296.0 95.0,324.0 6.0,296.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="288.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Сеть TON</text><text x="95.0" y="303.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">или GRAM?</text><rect x="204.0" y="275.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="287.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Перевести части на</text><text x="285.0" y="304.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">один адрес (+ газ)</text><rect x="204.0" y="347.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="359.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Дождаться</text><text x="285.0" y="376.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">поступления</text><rect x="397.0" y="423.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="475.0" y="431.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Один перевод</text><text x="475.0" y="448.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">игроку</text><rect x="14.0" y="419.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="431.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Переводы частями</text><text x="95.0" y="448.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">с каждого адреса</text><rect x="17.0" y="495.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="503.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Игрок получает</text><text x="95.0" y="520.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">несколько переводов</text></svg>