<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 652" width="570" height="652" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>С каких адресов идёт выплата</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="570" height="652" fill="#ffffff"/><rect x="0.8" y="8" width="568.4" height="634" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><rect x="0.8" y="8" width="568.4" height="40" fill="#f1f4f9" stroke="#94a3b8" stroke-width="1.4"/><text x="95.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Zerake</text><line x1="190" y1="8" x2="190" y2="642" stroke="#94a3b8" stroke-width="1.4"/><text x="285.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Адреса клуба</text><line x1="380" y1="8" x2="380" y2="642" stroke="#94a3b8" stroke-width="1.4"/><text x="475.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Игрок</text><path d="M95.0,109.0 L95.0,142.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M184.0,174.0 L204.0,174.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="178.0" y="149.0" width="32" height="22" rx="4" fill="#ffffff"/><text x="194.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Да</text><path d="M95.0,206.0 L95.0,235.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="103.0" y="209.5" width="41" height="22" rx="4" fill="#ffffff"/><text x="123.5" y="220.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Нет</text><path d="M366.0,174.0 L475.0,174.0 L475.0,491.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M95.0,281.0 L95.0,310.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M184.0,342.0 L204.0,342.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="178.0" y="317.0" width="32" height="22" rx="4" fill="#ffffff"/><text x="194.0" y="328.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Да</text><path d="M95.0,374.0 L95.0,487.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="74.5" y="413.9" width="41" height="22" rx="4" fill="#ffffff"/><text x="95.0" y="424.9" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Нет</text><path d="M285.0,365.0 L285.0,403.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M366.0,426.0 L475.0,426.0 L475.0,491.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M95.0,533.0 L95.0,575.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="17.0" y="71.0" width="156" height="38" rx="19.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="81.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Нужно</text><text x="95.0" y="98.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">выплатить X</text><polygon points="95.0,142.0 184.0,174.0 95.0,206.0 6.0,174.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="166.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Есть адрес,</text><text x="95.0" y="181.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">где лежит ≥ X?</text><rect x="204.0" y="151.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="165.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Взять самый маленький</text><text x="285.0" y="182.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">из подходящих</text><rect x="14.0" y="235.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="249.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Набрать X с нескольких</text><text x="95.0" y="266.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">адресов, с крупных</text><polygon points="95.0,310.0 184.0,342.0 95.0,374.0 6.0,342.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="334.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Сеть TON</text><text x="95.0" y="349.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">или GRAM?</text><rect x="204.0" y="319.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="333.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Перевести части на</text><text x="285.0" y="350.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">один адрес (+ газ)</text><rect x="204.0" y="403.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="417.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Дождаться</text><text x="285.0" y="434.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">поступления</text><rect x="397.0" y="491.0" width="156" height="38" rx="19.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="475.0" y="501.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Один перевод</text><text x="475.0" y="518.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">игроку</text><rect x="14.0" y="487.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="501.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Переводы частями</text><text x="95.0" y="518.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">с каждого адреса</text><rect x="17.0" y="575.0" width="156" height="38" rx="19.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="585.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Игрок получает</text><text x="95.0" y="602.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">несколько переводов</text></svg>