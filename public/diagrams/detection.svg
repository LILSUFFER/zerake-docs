ont-weight="600" fill="#334155">Нет</text><path d="M196.0,224.0 L173.0,224.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="184.5" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M285.0,252.0 L285.0,268.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="292.0" y="260.0" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M374.0,296.0 L386.0,296.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="380.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M285.0,324.0 L285.0,340.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="292.0" y="332.0" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M564.0,296.0 L584.0,296.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="574.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M475.0,324.0 L475.0,419.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="482.0" y="371.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M285.0,396.0 L285.0,419.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="292.0" y="407.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><path d="M196.0,368.0 L176.0,368.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="186.0" y="359.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M285.0,461.0 L285.0,495.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M475.0,461.0 L475.0,495.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="207.0" y="63.0" width="156" height="34" rx="17.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="285.0" y="71.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Подтверждённый</text><text x="285.0" y="88.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">перевод</text><polygon points="285.0,124.0 374.0,152.0 285.0,180.0 196.0,152.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="144.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Перевод между</text><text x="285.0" y="159.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">адресами клуба?</text><rect x="17.0" y="135.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="152.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Пропустить</text><polygon points="285.0,196.0 374.0,224.0 285.0,252.0 196.0,224.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="216.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Уже записан</text><text x="285.0" y="231.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">(сеть + хэш)?</text><rect x="17.0" y="207.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Пропустить</text><polygon points="285.0,268.0 374.0,296.0 285.0,324.0 196.0,296.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="288.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Сеть TRC20</text><text x="285.0" y="303.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">или BEP20?</text><polygon points="475.0,268.0 564.0,296.0 475.0,324.0 386.0,296.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="475.0" y="288.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Адрес закреплён,</text><text x="475.0" y="303.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">сумма ≥ минимума?</text><rect x="584.0" y="275.0" width="162" height="42" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="665.0" y="296.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">«Меньше минимума»</text><polygon points="285.0,340.0 374.0,368.0 285.0,396.0 196.0,368.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="360.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Есть заявка с этим</text><text x="285.0" y="375.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">адресом и суммой?</text><rect x="14.0" y="347.0" width="162" height="42" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="359.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Неопознанный:</text><text x="95.0" y="376.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">разбор вручную</text><rect x="204.0" y="419.0" width="162" height="42" rx="4" fill="#12a477" stroke="#0f8a63" stroke-width="1.6"/><text x="285.0" y="440.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">DEP-… «Получено»</text><rect x="394.0" y="419.0" width="162" height="42" rx="4" fill="#12a477" stroke="#0f8a63" stroke-width="1.6"/><text x="475.0" y="440.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">DEP-… «Получено»</text><rect x="207.0" y="495.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="285.0" y="503.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Очередь выдачи</text><text x="285.0" y="520.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">фишек</text><rect x="397.0" y="495.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="475.0" y="503.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Очередь выдачи</text><text x="475.0" y="520.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">фишек</text></svg>