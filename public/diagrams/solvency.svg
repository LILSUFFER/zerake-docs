<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 568" width="380" height="568" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Проверка средств клуба</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="380" height="568" fill="#ffffff"/><rect x="0.8" y="8" width="378.4" height="550" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><rect x="0.8" y="8" width="378.4" height="40" fill="#f1f4f9" stroke="#94a3b8" stroke-width="1.4"/><text x="95.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Zerake</text><line x1="190" y1="8" x2="190" y2="558" stroke="#94a3b8" stroke-width="1.4"/><text x="285.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Кошельки клуба</text><path d="M172.0,90.0 L285.0,90.0 L285.0,151.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M285.0,197.0 L285.0,235.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M204.0,258.0 L95.0,258.0 L95.0,319.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M95.0,365.0 L95.0,394.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M183.0,426.0 L204.0,426.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="173.0" y="401.0" width="41" height="22" rx="4" fill="#ffffff"/><text x="193.5" y="412.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Нет</text><path d="M95.0,458.0 L95.0,491.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><rect x="103.0" y="463.5" width="32" height="22" rx="4" fill="#ffffff"/><text x="119.0" y="474.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#334155">Да</text><rect x="18.0" y="71.0" width="154" height="38" rx="19.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="90.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Новая выплата X</text><rect x="204.0" y="151.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="165.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Сумма на всех</text><text x="285.0" y="182.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">адресах в сети</text><rect x="204.0" y="235.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="249.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">минус комиссии сети</text><text x="285.0" y="266.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">за каждый перевод</text><rect x="14.0" y="319.0" width="162" height="46" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="333.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">минус созданные, но</text><text x="95.0" y="350.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">не выплаченные снятия</text><polygon points="95.0,394.0 183.0,426.0 95.0,458.0 7.0,426.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="426.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Свободно ≥ X?</text><rect x="204.0" y="403.0" width="162" height="46" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="417.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Отказ: другая сеть</text><text x="285.0" y="434.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">или меньше сумма</text><rect x="18.0" y="491.0" width="154" height="38" rx="19.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="501.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Можно принять заявку</text><text x="95.0" y="518.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">и снять фишки</text></svg>