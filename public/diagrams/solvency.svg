<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 492" width="380" height="492" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Проверка средств клуба</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="380" height="492" fill="#ffffff"/><rect x="0.8" y="6" width="378.4" height="476" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><rect x="0.8" y="6" width="378.4" height="38" fill="#f1f4f9" stroke="#94a3b8" stroke-width="1.4"/><text x="95.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Zerake</text><line x1="190" y1="6" x2="190" y2="482" stroke="#94a3b8" stroke-width="1.4"/><text x="285.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1e293b">Кошельки клуба</text><path d="M173.0,80.0 L285.0,80.0 L285.0,131.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M285.0,173.0 L285.0,203.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M204.0,224.0 L95.0,224.0 L95.0,275.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M95.0,317.0 L95.0,340.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><path d="M184.0,368.0 L204.0,368.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="194.0" y="359.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Нет</text><path d="M95.0,396.0 L95.0,423.0" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/><text x="102.0" y="409.5" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#334155">Да</text><rect x="17.0" y="63.0" width="156" height="34" rx="17.0" fill="#c7f2e4" stroke="#12a477" stroke-width="1.6"/><text x="95.0" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0b3d2c">Новая выплата X</text><rect x="204.0" y="131.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="143.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">Сумма на всех</text><text x="285.0" y="160.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">адресах в сети</text><rect x="204.0" y="203.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="285.0" y="215.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">минус комиссии сети</text><text x="285.0" y="232.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">за каждый перевод</text><rect x="14.0" y="275.0" width="162" height="42" rx="4" fill="#ece6ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="95.0" y="287.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">минус созданные, но</text><text x="95.0" y="304.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3b2a7a">не выплаченные снятия</text><polygon points="95.0,340.0 184.0,368.0 95.0,396.0 6.0,368.0" fill="#fde2e4" stroke="#e0565f" stroke-width="1.6"/><text x="95.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7a1f2b">Свободно ≥ X?</text><rect x="204.0" y="347.0" width="162" height="42" rx="4" fill="#fff1f2" stroke="#e0565f" stroke-width="1.6"/><text x="285.0" y="359.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">Отказ: другая сеть</text><text x="285.0" y="376.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#7a1f2b">или меньше сумма</text><rect x="17.0" y="423.0" width="156" height="34" rx="17.0" fill="#e3f6c8" stroke="#7cb342" stroke-width="1.6"/><text x="95.0" y="431.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">Можно принять заявку</text><text x="95.0" y="448.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2f4a12">и снять фишки</text></svg>