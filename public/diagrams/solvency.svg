;"><rect x="161" y="124" width="120" height="59" rx="29.5" ry="29.5" fill="#c7f2e4" stroke="#12a477" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(199, 242, 228), rgb(9, 46, 34)); stroke: light-dark(rgb(18, 164, 119), rgb(29, 155, 116));"></rect></g><g style=""><g fill="#0B3D2C" font-family="'Segoe UI'" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(11, 61, 44), rgb(162, 205, 191));"><text x="221" y="144.5">Игрок хочет</text><text x="221" y="158.5">вывести сумму</text><text x="221" y="172.5">X в сети N</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="315" y="116" width="120" height="74" rx="8.88" ry="8.88" fill="#ede7ff" stroke="#8b5cf6" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(237, 231, 255), rgb(38, 33, 53)); stroke: light-dark(rgb(139, 92, 246), rgb(162, 122, 254));"></rect></g><g style=""><g fill="#3B2A7A" font-family="'Segoe UI'" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(59, 42, 122), rgb(200, 185, 254));"><text x="375" y="137">Сервер считает</text><text x="375" y="151">деньги на всех</text><text x="375" y="165">адресах клуба в</text><text x="375" y="179">сети N</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="469" y="124" width="120" height="59" rx="7.08" ry="7.08" fill="#ede7ff" stroke="#8b5cf6" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(237, 231, 255), rgb(38, 33, 53)); stroke: light-dark(rgb(139, 92, 246), rgb(162, 122, 254));"></rect></g><g style=""><g fill="#3B2A7A" font-family="'Segoe UI'" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(59, 42, 122), rgb(200, 185, 254));"><text x="529" y="144.5">Вычитает</text><text x="529" y="158.5">комиссии сети на</text><text x="529" y="172.5">переводы</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="623" y="124" width="120" height="59" rx="7.08" ry="7.08" f